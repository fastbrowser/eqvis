[package]
name = "eqvis"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.26", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "persistence"] }
egui = "0.26"
cpal = "0.15"
ringbuf = "0.3"
rodio = "0.22.2"
rfd = "0.17.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
 
[profile.release]
opt-level = 3
lto = true
 
 
